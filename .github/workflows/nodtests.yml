name: nodtests
# Тесты NOD (cad_source/zengine/TZ_NOD_NamedObjectDictionary.md, этапы 8–9):
# сборка и запуск cad_source/zengine/tests/nodstage*.lpr (fpc + исходники
# Lazarus, виджетсет nogui), см. cad_source/zengine/tests/nodtests.sh.
# Также проверяются режимы PolyFaceMesh и их headless OpenGL-рендеры.
on:
  push:
    paths:
      - 'cad_source/zengine/**'
      - 'cad_source/zcad/**'
      - 'cad_source/test/**'
      - 'cad_source/components/**'
      - 'environment/runtimefiles/AllCPU-AllOS/common/cfg/components/**'
      - 'experiments/issue1470/**'
      - 'experiments/issue1472/**'
      - 'experiments/issue1478/**'
      - '.gitmodules'
      - '.github/workflows/nodtests.yml'
  pull_request:
    branches: [master]
    paths:
      - 'cad_source/zengine/**'
      - 'cad_source/zcad/**'
      - 'cad_source/test/**'
      - 'cad_source/components/**'
      - 'environment/runtimefiles/AllCPU-AllOS/common/cfg/components/**'
      - 'experiments/issue1470/**'
      - 'experiments/issue1472/**'
      - 'experiments/issue1478/**'
      - '.gitmodules'
      - '.github/workflows/nodtests.yml'
  workflow_dispatch:
jobs:
  nodtests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Submodules
        run: |
          git submodule update --init --depth 1 \
            cad_source/components/zbaseutils cad_source/components/zcontainers \
            cad_source/components/zmath cad_source/components/zreaders \
            cad_source/components/zunits cad_source/components/zmacros \
            cad_source/components/zundostack
      - name: Install test dependencies
        env:
          LEGACY_ENGINE_TESTS: ${{ hashFiles('cad_source/zengine/tests/nodtests.sh', 'cad_source/zengine/tests/polyfacemeshdisplay.lpr') != '' }}
        run: |
          sudo apt-get update
          if [ "$LEGACY_ENGINE_TESTS" = true ]; then
            sudo apt-get install -y --no-install-recommends fpc lazarus-src \
              libegl1 libgl1 libgl1-mesa-dri
          else
            sudo apt-get install -y --no-install-recommends fp-compiler fp-units-fcl
          fi
      - name: HTTP server CORS regression
        timeout-minutes: 1
        run: node experiments/issue1472/test_httpserver.mjs
      - name: Export selection regression
        timeout-minutes: 2
        run: |
          mkdir -p /tmp/zcad-export1478
          fpc -Fucad_source/zcad/velec/IPCserver -FU/tmp/zcad-export1478 \
            -FE/tmp/zcad-export1478 experiments/issue1478/test_export_selection.pas
          /tmp/zcad-export1478/test_export_selection
          node experiments/issue1478/test_export_route.mjs
      - name: Wall analyzer regression
        timeout-minutes: 1
        run: |
          mkdir -p /tmp/zcad-walls
          cd cad_source/zcad/velec/IPCserver/skills/walls
          fpc -Fu. -FU/tmp/zcad-walls -FE/tmp/zcad-walls test_walls.pas
          /tmp/zcad-walls/test_walls
      - name: NOD tests
        if: ${{ hashFiles('cad_source/zengine/tests/nodtests.sh') != '' }}
        timeout-minutes: 20
        run: make -C cad_source/zengine/tests nodtests
      - name: Polyface mesh display tests
        if: ${{ hashFiles('cad_source/zengine/tests/polyfacemeshdisplay.lpr') != '' }}
        timeout-minutes: 5
        run: make -C cad_source/zengine/tests meshdisplaytests
      - name: Polyface mesh OpenGL visual regression
        if: ${{ hashFiles('cad_source/zengine/tests/polyfacemeshdisplay.lpr') != '' }}
        timeout-minutes: 2
        run: bash experiments/issue1470/run_visual.sh
      - name: Upload mesh renders
        if: ${{ hashFiles('cad_source/zengine/tests/polyfacemeshdisplay.lpr') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: polyfacemesh-renders
          path: /tmp/zcad-nodtests/mesh-renders/*.png
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nodtests-logs
          path: /tmp/zcad-nodtests/*.log
