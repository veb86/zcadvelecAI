<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="256"
   height="256"
   viewBox="0 0 256 256"
   version="1.1">
  <defs>
    <style>
      .table { fill: none; stroke: #20A8FF; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: none; stroke: #008C00; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Таблица 2x2 -->
  <rect class="table" x="40" y="52" width="176" height="152" rx="0" ry="0"/>
  <line class="table" x1="128" y1="52" x2="128" y2="204"/>
  <line class="table" x1="40" y1="128" x2="216" y2="128"/>

  <!-- Стрелки к центру как обозначение объединения -->
  <polyline class="arrow" points="72,72 112,112 96,112"/>
  <polyline class="arrow" points="72,72 112,112 112,96"/>
  <polyline class="arrow" points="184,72 144,112 160,112"/>
  <polyline class="arrow" points="184,72 144,112 144,96"/>
  <polyline class="arrow" points="72,184 112,144 96,144"/>
  <polyline class="arrow" points="72,184 112,144 112,160"/>
  <polyline class="arrow" points="184,184 144,144 160,144"/>
  <polyline class="arrow" points="184,184 144,144 144,160"/>
</svg>
